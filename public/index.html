<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111827">
  <title>DoorOps</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-mark"><img src="/logo.png" alt="DoorOps" style="height:64px;width:auto;border-radius:10px;background:#e8ede6;padding:8px;"></div>
          <div class="logo-tagline" style="margin-top:10px;">Field ops for door companies</div>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" onclick="showTab('login')">Sign In</button>
          <button class="auth-tab" onclick="showTab('signup')">Start Free Trial</button>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="you@company.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <div id="login-error" class="auth-error" style="display:none;"></div>
          <button type="submit" class="btn-auth">Sign In</button>
        </form>

        <form id="signup-form" style="display:none;" onsubmit="handleSignup(event)">
          <div class="form-group">
            <label>Company Name</label>
            <input type="text" id="signup-company" placeholder="Acme Overhead Doors" required>
          </div>
          <div class="form-group">
            <label>Your Name</label>
            <input type="text" id="signup-name" placeholder="John Smith" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signup-email" placeholder="you@company.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="signup-password" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
          </div>
          <div id="signup-error" class="auth-error" style="display:none;"></div>
          <button type="submit" class="btn-auth">Start 14-Day Free Trial</button>
          <p class="auth-fine-print">No credit card required. Cancel anytime.</p>
        </form>
      </div>
    </div>

    <!-- App Shell -->
    <div id="app-shell" style="display:none;">
      <nav class="top-nav">
        <button class="nav-menu-btn" onclick="toggleMenu()">☰</button>
        <div class="nav-brand">
          <img src="/logo.png" alt="DoorOps" style="height:30px;width:auto;border-radius:5px;background:#e8ede6;padding:4px;">
          <span id="nav-company-name" class="nav-company-name"></span>
        </div>
        <div id="settings-info" style="display:none;"></div>
      </nav>

      <div class="app-layout">
        <!-- Sidebar (desktop) -->
        <div id="sidebar" class="sidebar">
          <div class="sidebar-section">
            <button class="sidebar-item" data-page="dashboard" onclick="navigate('dashboard')">📊 Dashboard</button>
            <button class="sidebar-item" data-page="inspections" onclick="navigate('inspections')">🔍 Inspections</button>
            <button class="sidebar-item" data-page="team" onclick="navigate('team')">👥 Team</button>
            <button class="sidebar-item" data-page="settings" onclick="navigate('settings')">⚙️ Settings</button>
          </div>
          <div class="sidebar-bottom">
            <button class="sidebar-item" onclick="handleLogout()">→ Sign Out</button>
          </div>
        </div>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
          <div id="page-dashboard" class="page"></div>
          <div id="page-inspections" class="page" style="display:none;"></div>
          <div id="page-team" class="page" style="display:none;"></div>
          <div id="page-settings" class="page" style="display:none;"></div>
        </main>
      </div>

      <!-- Bottom Nav (mobile only) -->
      <nav class="bottom-nav">
        <button class="bottom-nav-btn" data-page="dashboard" onclick="navigate('dashboard')">
          <span class="bottom-nav-icon">📊</span>
          <span class="bottom-nav-label">Dashboard</span>
        </button>
        <button class="bottom-nav-btn" data-page="inspections" onclick="navigate('inspections')">
          <span class="bottom-nav-icon">🔍</span>
          <span class="bottom-nav-label">Inspections</span>
        </button>
        <button class="bottom-nav-btn" data-page="team" onclick="navigate('team')">
          <span class="bottom-nav-icon">👥</span>
          <span class="bottom-nav-label">Team</span>
        </button>
        <button class="bottom-nav-btn" data-page="settings" onclick="navigate('settings')">
          <span class="bottom-nav-icon">⚙️</span>
          <span class="bottom-nav-label">Settings</span>
        </button>
      </nav>
    </div>
  </div>

  <script src="/app.js?v=5"></script>
  <script src="/inspections.js?v=5"></script>
  <script src="/checklist.js?v=5"></script>
  <script src="/dashboard.js?v=5"></script>
</body>
</html>
